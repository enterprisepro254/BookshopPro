<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

button{cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:#e6ecea;color:var(--ink)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:13px}

nav .sp{flex:1}nav span{font-size:13px;color:#9fb8b3;margin-right:8px}
main{padding:18px;max-width:1150px;margin:auto}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat small{color:var(--mut)}.stat div{font-family:Georgia,serif;font-size:26px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}

.num{text-align:right}.mut{color:var(--mut)}h2{margin-bottom:12px;font-size:22px}h3{margin-bottom:8px;font-size:17px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none}
.ov{position:fixed;inset:0;background:rgba(20,39,46,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.md{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:440px}.md label{display:block;margin-top:12px;font-size:13px;color:var(--mut)}.md label input,.md label select{margin-top:4px;color:var(--ink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px}.tools input{flex:1;min-width:200px;border-radius:10px;background:#f6f9f8}
.st th{background:#f6f9f8;color:#8a9aa0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:12px 10px}.st td{padding:14px 10px;vertical-align:middle}.st th:first-child,.st td:first-child{padding-left:16px}.st th:last-child,.st td:last-child{padding-right:16px;text-align:right;white-space:nowrap}
button.lk{background:none;color:var(--acc);padding:0 6px;font-size:14px}button.lk.d{background:none;color:var(--bad)}
.bdg{background:var(--hi);color:var(--ink);border-radius:99px;padding:1px 7px;font-size:12px;font-weight:700}
.chat{display:grid;gap:14px;grid-template-columns:250px 1fr;align-items:start}.chat.one{grid-template-columns:1fr}@media(max-width:700px){.chat{grid-template-columns:1fr}}
button.th{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);padding:8px 10px;margin-bottom:4px;border-radius:8px;font-weight:400}button.th.on{background:#e6ecea}
.clog{height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.bub{max-width:78%;padding:8px 12px;border-radius:12px;background:#e6ecea;align-self:flex-start;white-space:pre-wrap;word-break:break-word}.bub.me{align-self:flex-end;background:var(--acc);color:#fff}.bub small{display:block;opacity:.7;font-size:11px;margin-top:3px}
.rpbox{border:1px solid var(--line);border-radius:8px;padding:18px;max-height:68vh;overflow:auto;background:#fff}
.rpt{color:#111;font-size:13px}.rpt h1{font-family:Georgia,serif;font-size:26px;margin:0;color:var(--acc)}.rpt .lh{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--acc);padding-bottom:10px;margin-bottom:14px}.rpt .lh img{max-height:64px;max-width:160px}
.rpt .ld{color:#555;font-size:12px}.rpt h3{border-bottom:1px solid #ccd5d1;padding-bottom:3px;margin:18px 0 8px}.rpt table{width:100%;border-collapse:collapse;margin:8px 0}.rpt th,.rpt td{border:1px solid #cfd5d3;padding:4px 6px;font-size:12px;text-align:left}.rpt th{background:#fff200;color:#111}.rpt tr.tot td{background:#f3f3f3}.rpt .ttl{text-align:center;font-weight:700;letter-spacing:.08em;font-size:16px;margin:4px 0}.rpt .n{text-align:right}
.rpt .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rpt .kp div{border:1px solid #ccd5d1;border-radius:6px;padding:8px}.rpt .kp small{display:block;color:#555}.rpt .kp b{font-family:Georgia,serif;font-size:16px}.rpt .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.dh h2{margin:0;font-size:24px}.dh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.dr{display:flex;align-items:center;gap:12px}.chip{background:#e6ecea;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.who{text-align:right;font-size:13px}.who span{display:block;color:var(--acc);font-weight:700;letter-spacing:.07em;font-size:10px}
.av{width:38px;height:38px;border-radius:50%;background:#d8ebe8;color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
.ql{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;border-radius:14px}.ql small{color:var(--mut);font-weight:700;letter-spacing:.08em;font-size:11px}button.rose{background:#d4577a}
.sc{border-radius:14px}.sc small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.sc b{display:block;font-family:Georgia,serif;font-size:26px;margin:4px 0}.sc span{font-size:12px;color:var(--mut)}
.dg{display:grid;gap:14px;grid-template-columns:minmax(260px,1fr) 2fr}@media(max-width:800px){.dg{grid-template-columns:1fr}}
.pb{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f3f7f5;border-radius:12px;padding:14px 16px;margin-top:12px}.pr{display:flex;justify-content:space-between;padding:3px 0}
.bar2{height:6px;background:#e6ecea;border-radius:99px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc)}
.rtool{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px;margin-bottom:14px;border-radius:14px}.rbtn{display:flex;gap:10px;flex-wrap:wrap}
.rfil{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.rfil label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.rfil select,.rfil input{margin-top:4px;min-width:140px;font-weight:400;letter-spacing:0;text-transform:none}
.thd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.rfl{display:flex;gap:6px 22px;flex-wrap:wrap;margin:0 0 10px}.md label.rd{display:inline-flex;align-items:center;gap:7px;margin:0;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}.rd input{width:auto;padding:0;margin:0!important;accent-color:#5b9bd5}
#rpPrint{display:none}
@media print{nav,.noprint{display:none}body.rp>*{display:none!important}body.rp>#rpPrint{display:block!important}body.rp{background:#fff}@page{margin:14mm}.rpt *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.rpt tr{break-inside:avoid}.rpt h3{break-after:avoid}}
</style></head><body>

<script>
const KEY='bookshopPro.v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kes=n=>'KSh '+Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const CATS=['Exercise books','Textbooks','Story books','Revision / CBE books','Stationery','Others'];
const UNITS=['bxs', 'pcs', 'ream', 'pkt'];
const TENDER=[["Photocopying papers", "REAM"], ["Ruled paper (Kasuku)", "REAM"], ["Dusterless chalk", "CTNS"], ["Black board dusters", "PCS"], ["Counter books 2Q", "PCS"], ["Counter books 3Q", "PCS"], ["Spring files Manila", "PCS"], ["Staples size 10", "PKT"], ["Staples 24/6 5000 pack", "PKT"], ["Staples 23/17", "PKT"], ["Office glue 160gms", "Bottle"], ["Glue stick 22gms", "PCS"], ["Masking tape", "PCS"], ["Marker pens (Showman/Ambassador) @ carbon paper pelican", "PCS"], ["White board ink (Leto)", "PCS"], ["Correcting fluid", "Bottle"], ["New and refillable white board markers", "PCS"], ["Manila papers (assorted colours)", "PCS"], ["Folder files 250gms", "PCS"], ["File fasteners", "PKT"], ["Pelikan stamp pad ink", "PCS"], ["Thumb tacks", "PKT"], ["Print cartridge 83A", "Tube"], ["Print cartridge 17A", "Tube"], ["Riso master EZ A4", "Rolls"], ["Riso ink EZ black", "Tube"], ["Graph papers 5 grid", "Ream"], ["White board dusters (Office Point)", "Pcs"], ["Ball pens (Bic) 50 pcs", "Pkt"], ["Binding tapes per roll", "Roll"], ["Fees register (Elimu)", "Pcs"], ["HB pencil per pack", "Pack"], ["Mark books 2 quire (Kasuku)", "Pcs"], ["Copy printer ink CP1", ""], ["Elimu attendance register", "PCS"], ["Copy printer masters CPMT20", ""], ["Kyocera 1800 toner", "Tube"], ["Kyocera FS 2100 toner", "Tube"], ["Epson Clarion ink 100ml (all colours)", ""], ["Rico printer MPC 300 toner", "Tube"]];
function seedTender(d){if(d.tenderLoaded)return;const have=new Set(d.books.map(b=>b.title.toLowerCase()));
 TENDER.forEach(([t,u],i)=>{if(!have.has(t.toLowerCase()))d.books.push({id:'tn'+(i+1),title:t,author:'',isbn:'',code:'',unit:u,cat:'Stationery',cost:0,price:0,qty:0,min:0})});d.tenderLoaded=true}
let db=load(),me=null,view='dash',cart=[];save();
function r4(n){return Math.round(n*10000)/10000}
function migrate(d){
 d.purchases=d.purchases||[];d.services=d.services||[];d.shop=d.shop||'BookShop Pro';d.shopInfo=d.shopInfo||{};d.messages=d.messages||[];
 d.books.forEach(b=>{if(b.map)return;const ps=d.purchases.filter(p=>p.bookId===b.id);
  if(ps.some(p=>p.rem===undefined)||(!ps.length&&b.qty>0)){let left=b.qty;
   for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.rem=Math.max(0,Math.min(p.qty,left));left=r4(left-p.rem)}
   if(left>1e-9)d.purchases.unshift({id:uid(),date:'2000-01-01',ts:'2000-01-01T00:00:00.000Z',supplier:'',bookId:b.id,title:b.title,qty:left,rem:left,cost:b.cost||0,open:true})}});
 const adm=(d.users.find(u=>u.role==='admin')||{}).id||'';
 d.messages.forEach(m=>{if(m.to===undefined){m.to=m.fromRole==='staff'?adm:m.thread;m.thread=[m.from,m.to].sort().join('|')}});
 
 // Serialization migration for existing sales
 let saleCounter = 1;
 (d.sales || []).forEach(s => {
  if (!s.serialNo) {
    s.serialNo = 'TXN-' + String(saleCounter++).padStart(5, '0');
  }
 });
 return d}
function lotsOf(b){return db.purchases.filter(p=>p.bookId===b.id&&p.rem>0)}
function valOf(b){const l=lotsOf(b);return l.length?sum(l,p=>p.rem*p.cost):b.cost*b.qty}
function recalc(b){const l=lotsOf(b),q=sum(l,p=>p.rem);if(q>0)b.cost=Math.round(sum(l,p=>p.rem*p.cost)/q*100)/100}
function takeStock(b,amt){let left=amt,cost=0;const used=[];
 for(const p of db.purchases){if(left<=1e-9)break;if(p.bookId!==b.id||!(p.rem>0))continue;const t=Math.min(p.rem,left);p.rem=r4(p.rem-t);left=r4(left-t);cost+=t*p.cost;used.push({pid:p.id,q:t})}
 b.qty=r4(b.qty-amt);recalc(b);return{cost:cost+Math.max(left,0)*(b.cost||0),used}}
function putBack(b,amt,used){let left=amt;
 (used||[]).forEach(u=>{const p=db.purchases.find(x=>x.id===u.pid);if(p){p.rem=r4(p.rem+u.q);left=r4(left-u.q)}});
 if(left>1e-9){const ps=db.purchases.filter(p=>p.bookId===b.id),p=ps[ps.length-1];
  if(p)p.rem=r4(p.rem+left);else db.purchases.unshift({id:uid(),date:today(),ts:new Date().toISOString(),supplier:'',bookId:b.id,title:b.title,qty:left,rem:left,cost:b.cost||0,open:true})}
 b.qty=r4(b.qty+amt);recalc(b)}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){seedTender(d);migrate(d);return d}}catch(e){}
 const d0={users:[{id:'u1',name:'Administrator',user:'admin',pass:'admin123',role:'admin'},{id:'u2',name:'Shop Staff',user:'staff',pass:'staff123',role:'staff'}],
 books:[],sales:[],expenses:[],purchases:[],services:[],shop:'BookShop Pro'};seedTender(d0);migrate(d0);return d0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save: browser storage is full or blocked')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const admin=()=>me.role==='admin';
const invOf=b=>(b.map&&db.books.find(x=>x.id===b.map))||b;
const perOf=b=>invOf(b)===b?1:(b.per||1);
const availOf=b=>Math.floor(invOf(b).qty/perOf(b)+1e-9);
const lowOf=b=>invOf(b)!==b?availOf(b)<1:(b.min>0&&b.qty<=b.min);

$('#lb').onclick=login;$('#lp').onkeydown=e=>{if(e.key==='Enter')login()};
function login(){const u=db.users.find(x=>x.user===$('#lu').value.trim()&&x.pass===$('#lp').value);
 if(!u){$('#le').textContent='Wrong username or password.';return}
 me=u;chatWith=null;$('#login').style.display='none';$('#app').style.display='block';view='dash';nav();render();if(unreadAll())toast('You have '+unreadAll()+' unread message(s) in Notifications')}
function nav(){const t=[['dash','Dashboard'],['stock','Stock'],['sales','Sales Ledger'],['exp','Expenses'],['rep','Reports'],['notif','Notifications'],['staff','Settings']].filter(x=>admin()||['dash','stock','sales','notif'].includes(x[0]));
 
 $('#nav').innerHTML='<b>'+esc(db.shop)+'</b>'+t.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}${k==='notif'&&unreadAll()?' <span class="bdg">'+unreadAll()+'</span>':''}</button>`).join('')+
 `<span class="sp"></span><span>${esc(me.name)} (${me.role})</span><button class="g s" onclick="location.reload()">Sign out</button>`}
function go(v){view=v;panel=null;nav();render()}
function render(){$('#main').innerHTML=({dash,stock,sales,exp,rep,notif,staff}[view])();const l=$('#clog');if(l)l.scrollTop=l.scrollHeight}

function sum(a,f){return a.reduce((t,x)=>t+f(x),0)}
function inRange(d,a,b){return(!a||d>=a)&&(!b||d<=b)}
function profit(s){return sum(s.items,i=>(i.price-i.cost)*i.qty)}

function dash(){const t=today(),ss=db.sales.filter(s=>!s.void&&s.date.slice(0,10)===t),mine=admin()?ss:ss.filter(s=>s.by===me.id);
 const tot=sum(mine,s=>s.total),cash=sum(mine.filter(s=>s.method==='Cash'),s=>s.total),mp=sum(mine.filter(s=>s.method==='M-Pesa'),s=>s.total),oth=r4(tot-cash-mp);
 const byI={};mine.forEach(s=>s.items.forEach(i=>{const o=byI[i.title]||(byI[i.title]={q:0,r:0});o.q+=i.qty;o.r+=i.price*i.qty}));
 const items=Object.entries(byI).sort((x,y)=>y[1].r-x[1].r),low=db.books.filter(b=>(b.min>0&&b.qty<=b.min));
 const ini=me.name.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
 const prow=(l,sub,v,c)=>`<div class="pb"><div><b>${l}</b><div class="mut" style="font-size:12px">${sub}</div></div><b style="color:${c}">${kes(v)}</b></div>`;
 return`<div class="dh"><div><h2>Dashboard Overview</h2><p>Real-time collections, payment breakdown, and today's sales performance.</p></div>
 <div class="dr"><span class="chip">${new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><div class="who"><b>${admin()?'Manager':'Staff'}: ${esc(me.name)}</b><span>ACTIVE SESSION</span></div><div class="av">${esc(ini)}</div></div></div>
 <div class="card ql noprint"><small>QUICK LINKS</small><button onclick="openSale()">+ Record Sale</button>${admin()?'<button class="rose" onclick="openExpense()">+ Log Expense</button>':''}</div>
 <div class="grid g4"><div class="card sc"><small>Today's sales</small><b>${kes(tot)}</b><span>&uarr; Total Gross</span></div>
 <div class="card sc"><small>Cash received</small><b style="color:var(--ok)">${kes(cash)}</b><span>Drawer Cash</span></div>
 <div class="card sc"><small>M-Pesa received</small><b style="color:#6b5bd2">${kes(mp)}</b><span>Digital Payments</span></div>
 <div class="card sc"><small>Today's receipts</small><b style="color:#b27608">${mine.length}</b><span>Completed Sales</span></div></div>
 <div class="dg" style="margin-top:14px"><div class="card"><h3>Today's Payment Breakdown</h3><div class="mut" style="font-size:13px">Summary of cash vs M-Pesa collections.</div>
 ${prow('Physical Cash','Drawer collections',cash,'var(--ok)')}${prow('M-Pesa Paybill/Till','Digital collections',mp,'#6b5bd2')}${oth>0?prow('Other payments','Not cash or M-Pesa',oth,'var(--ink)'):''}
 ${admin()?`<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)"><div class="pr"><span class="mut">Gross profit today</span><b>${kes(sum(ss,profit))}</b></div><div class="pr"><span class="mut">Expenses today</span><b>${kes(sum(db.expenses.filter(e=>e.date===t),e=>e.amt))}</b></div></div>`:''}</div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><h3>Today's Sales Performance</h3><div class="mut" style="font-size:13px">Breakdown of items sold today.</div></div><span class="chip">Today</span></div>
 ${items.length?`<div class="wrap"><tr><th>Item</th><th class="num">Qty</th><th class="num">Revenue</th><th style="width:26%">Share</th></tr>${items.slice(0,12).map(([n,o])=>`<tr><td><b>${esc(n)}</b></td><td class="num">${r4(o.q)}</td><td class="num">${kes(o.r)}</td><td><div class="bar2"><i style="width:${tot?Math.round(o.r/tot*100):0}%"></i></div></td></tr>`).join('')}</table></div>`:'<div class="mut" style="text-align:center;padding:48px 0">No sales recorded for today yet.</div>'}</div></div>

function openSale(){

 const r=takeStock(iv,q*pr),line=iv===b?{id:b.id,title:b.title,qty:q,price:p}:{id:b.id,title:b.title,qty:q,price:p,item:iv.id,per:pr};
 
 // Serialized Transaction ID
 db.sales = db.sales || [];
 const nextSerialNum = db.sales.length + 1;
 const serialNo = 'TXN-' + String(nextSerialNum).padStart(5, '0');

 const s={id:uid(),serialNo:serialNo,date:new Date().toISOString(),by:me.id,items:[{...line,cost:r.cost/q,lots:r.used}],total:Math.round(q*p*100)/100,method:$('#sl_pm').value,customer:''};
